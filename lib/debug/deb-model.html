<!DOCTYPE html>
<html>
    <head>
        <title>Debugging Models</title>
        
        <script src="../js/utils.js"></script>
        <script src="../js/domutils.js"></script>
        <script src="../js/gear.js"></script>
        <script src="../js/cfg.js"></script>
        <script src="../js/viewmakers.js"></script>
        <script src="../js/equipment.js"></script>
        <script src="../js/stack.js"></script>
        <script src="../js/fsmachine.js"></script>
        <script src="../js/httpfetcher.js"></script>
        <script src="../js/htmlfetcher.js"></script>
        <script src="../js/jsonfetcher.js"></script>
        <script src="../js/vertex.js"></script>
        <script src="../js/task.js"></script>
        <script src="../js/bureaucrat.js"></script>
        <script src="../js/controller.js"></script>
        <script src="../js/domcontrol.js"></script>
        <script src="../js/uicontrols.js"></script>
        <script src="../js/page.js"></script>
        <script src="../js/model.js"></script>
        <script src="../js/modelmakers.js"></script>
        <script src="../js/app.js"></script>
        <script src="deb-model.js"></script>

        <style>

            body {
                margin: 0;
            }

            #screen {
                width: 100vw;
                height: 100vh;
                margin: 0;
                background: #cccccc;
            }

            #pageHeader {
                margin: 0;
                height: 100px;
                background: #ff0000;
            }

            #logo {
                display: inline-block;
                vertical-align: top;
                width: 100px;
                height: 100%;
                margin: 0;
                background: #ffffff;
            }

            #logo img {
                height: 90%;
                margin-top: 5%;
                margin-inline-start: 5px;
            }

            #banner {
                display: inline-block;
                vertical-align: top;
                width: calc(100vw - 100px);
                height: 100%;
                margin: 0;
                background: #ffffff;
            } 

            #banner p {
                width: fit-content;
                margin-inline-start: 20pt;
                background: #ffffff;
            }

            #console {
                height: calc(100vh - 100px);
                margin: 0;
            }

            #toolbarArea {
                height: 50px;
                border: 1px solid #000000;
                background: #ffffff;
            }

            #toolbar {
                display: flex;
                height: 100%;
                margin-inline-start: 5px;
                align-items: center;
            }

            .toolbar_button__outer {
                display: inline-block;
                cursor: pointer;
            }

            #content {
                display: flex;
                height: calc(100% - 52px);
                justify-content: center;
                align-items: center;
                background: #ffffff;
            }

            .zoo_ctrl__outer {
                width: fit-content;
                padding: 5pt;
                border: 3pt solid black;
                background: #FAE29C 
            }

            .zoo_ctrl__outer td {
                border: 1pt solid black;
            }

            .zoo_ctrl__inner {
                padding: 5pt;
                border: 1pt solid rgb(142, 135, 135);
                background: #aaffff;
            }

            .cage_ctrl__outer {
                display: inline-block;
                width: 80pt;
                height: 60pt;
                margin: 5pt;
                padding: 5pt;
                border: 1pt dashed black;
            }

            .cage_ctrl__inner--open {
                padding: 5pt;
                background: #e1e9dd;
            }

            .cage_ctrl__inner--closed {
                padding: 5pt;
                background: #e1e9dd;
            }

            img.animal_ctrl {
                position: absolute;
                height: 50pt;
            }
        </style>

    </head>
    <body onload="main()">
        <div id="screen">
            <div id="pageHeader"><div id="logo"><img src="img/logo.jpg"></div><div id="banner"></div></div>
            <div id="console">
                <div id="toolbarArea">       
                    <div id="toolbar" data-rnav-control="Toolbar"></div>
                </div>
                <div id="content" data-rnav-control="RNav_DOMControl"></div>
            </div>
        </div>
    </body>
</html>
