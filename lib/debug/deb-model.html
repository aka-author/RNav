<!DOCTYPE html>
<html>
    <head>
        <title>Debugging Models</title>
        
        <script src="../js/setupconst.js"></script>
        <script src="../js/utils.js"></script>
        <script src="../js/domutils.js"></script>
        <script src="../js/gear.js"></script>
        <script src="../js/cfg.js"></script>
        <script src="../js/viewmakers.js"></script>
        <script src="../js/equipment.js"></script>
        <script src="../js/stack.js"></script>
        <script src="../js/fsmachine.js"></script>
        <script src="../js/httpfetcher.js"></script>
        <script src="../js/htmlfetcher.js"></script>
        <script src="../js/jsonfetcher.js"></script>
        <script src="../js/vertex.js"></script>
        <script src="../js/task.js"></script>
        <script src="../js/bureaucrat.js"></script>
        <script src="../js/controller.js"></script>
        <script src="../js/domcontrol.js"></script>
        <script src="../js/uicontrols.js"></script>
        <script src="../js/page.js"></script>
        <script src="../js/model.js"></script>
        <script src="../js/modelmakers.js"></script>
        <script src="../js/app.js"></script>
        <script src="deb-model.js"></script>

        <style>

            :root {
                --header-height: 100px;
                --logo-width: 100px;
                --toolbar-height: 50px;
                --framelet-indent: 20pt;

                --content-height: calc(100vh - var(--header-height) 
                    - var(--toolbar-height) - 4*var(--framelet-indent));

                --desc-title-height: 40pt;
                --desc-max-width: 30vw;
                --desc-content-indent: calc(var(--framelet-indent) / 2);

                --border-color: #916d6b;
            }

            body {
                margin: 0;
                overflow: hidden;
            }

            #screen {
                width: 100vw;
                height: 100vh;
                margin: 0;
                background: #cccccc;
            }

            #pageHeader {
                height: var(--header-height);
            }

            #logo {
                display: inline-block;
                vertical-align: top;
                width: var(--logo-width);
                height: 100%;
                background: #ffffff;
            }

            #logo img {
                height: 90%;
                margin-top: 5%;
                margin-inline-start: 5px;
            }

            #banner {
                display: inline-block;
                vertical-align: top;
                width: calc(100vw - var(--logo-width));
                height: 100%;
                background: #ffffff;
            } 

            #console {
                height: calc(100vh - var(--header-height) - var(--toolbar-height));
            }

            #toolbarArea {
                height: var(--toolbar-height);
                border: 1px solid #000000;
                background: #ffffff;
            }

            #toolbar {
                display: flex;
                height: 100%;
                margin-inline-start: 5px;
                align-items: center;
            }

            .toolbar_button__outer {
                display: inline-block;
                cursor: pointer;
            }

            #contentOuter {
                display: flex;
                width: 100vw;
                height: calc(100vh - var(--header-height) - var(--toolbar-height));
                justify-content: center;
                align-items: center;
            }

            #content {
                --display: flex;
                width: fit-content;
                height: fit-content;
                padding: var(--framelet-indent);
                gap: var(--framelet-indent);
                overflow: hidden;
                border: 1px solid var(--border-color);
                background: #ffffff;
            }

            .zoo_ctrl__outer {
                display: inline-block;
                height: fit-content;
                --max-height: calc(var(--content-height) - 2*var(--framelet-indent));
                max-height: calc(100% - 2*var(--framelet-indent));
                border: 3pt solid var(--border-color);
                overflow-y: scroll;
                background: #FAE29C 
            }

            .zoo_ctrl__outer td {
                border: 1pt solid black;
            }

            .zoo_ctrl__inner {
                padding: 5pt;
                border: 1pt solid rgb(142, 135, 135);
                background: #aaffff;
            }

            .cage_ctrl__outer {
                display: inline-block;
                width: 80pt;
                height: 60pt;
                margin: 5pt;
                padding: 5pt;
                border: 1pt dashed black;
            }

            .cage_ctrl__inner--open {
                padding: 5pt;
                background: #e1e9dd;
            }

            .cage_ctrl__inner--closed {
                padding: 5pt;
                background: #e1e9dd;
            }

            img.animal_ctrl {
                --position: absolute;
                height: 50pt;
            }

            .animal_desc_ctrl__outer {
                display: inline-block;
                max-width: 30vw;
                --height: fit-content;
                --max-height: calc(100% - 2*var(--framelet-indent));
                border: 5px solid var(--border-color);
            }

            .animal_desc_ctrl__title_outer {
                display: flex;
                height: var(--desc-title-height);
                align-items: center;
            }

            .animal_desc_ctrl__title_inner {
                display: inline-block;
                width: fit-content;
                --height: fit-content;
                margin: var(--desc-content-indent);
                font-family: 'Lucida';
                font-weight: bold;
                font-size: 20pt;
            }

            .animal_desc_ctrl__matter_outer {
                --height: calc(100% - var(--desc-title-height));
                border-top: 1px solid #000000;
                overflow-y: scroll;
            }

            .animal_desc_ctrl__matter_inner {

                height: calc(100% - var(--desc-title-height));
                --height: fit-content;
                

                max-height: calc(var(--content-height) 
                    - 2*var(--framelet-indent) - var(--desc-title-height));   

                margin-inline-start: var(--desc-content-indent);
                margin-top: var(--desc-content-indent);
                font-size: 14pt;
                line-height: 18pt;
            }
        </style>

    </head>
    <body onload="main()">
        <div id="screen">
            <div id="pageHeader"><div id="logo"><img src="img/logo.jpg"></div><div id="banner"></div></div>
            <div id="console">
                <div id="toolbarArea">       
                    <div id="toolbar" data-kwish-control="Toolbar"></div>
                </div>
                <div id="contentOuter">
                    <div id="content" data-kwish-control="kwish_DOMControl"></div>
                </div>
            </div>
        </div>
    </body>
</html>
