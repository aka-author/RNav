<!DOCTYPE html><html lang="en" dir="ltr">
   <head>
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
      <title>The Cookbook</title>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta charset="utf-8">
      <link rel="stylesheet" href="front/css/helpui.css">
      <link rel="stylesheet" href="front/css/matter.css"><script src="front/js/cfg.js"></script><script src="front/js/rsrc.js"></script><script src="data/tocstruct.js"></script><script src="data/toctitles.js"></script><script src="data/i18n.js"></script><script src="data/searchindex.js"></script><script src="front/js/kwish.js"></script><script src="front/js/arnav.js"></script></head>
   <body onload="main()">
      <div id="shell">
         <div id="pageHeader">
            <div id="pageHeaderInner">
               <div id="logo"></div>
               <div id="burger" data-kwish-control="Burger"></div>
               <div id="banner">
                  <div id="bannerInner">
                     <div id="searcher" data-kwish-control="Searcher"></div>
                  </div>
               </div>
            </div>
         </div>
         <div id="consoleKeeper" data-kwish-control="ConsoleKeeper">
            <div id="readerConsole" data-kwish-control="ReaderConsole" class="console">
               <div id="tocFramelet" data-kwish-control="TocFramelet"></div>
               <div id="matterFramelet" data-kwish-control="MatterFramelet" class="framelet">
                  <div class="framelet__inner">
                     <div id="topicContolPanel">
                        <div data-kwish-control="Breadcrumbs"></div>
                        <div id="printButton" data-kwish-control="PrintButton"></div>
                     </div>
                     <div id="pageMatter">
                        <h1>The Cookbook</h1>
                     </div>
                  </div>
               </div>
            </div>
            <div id="searchConsole" data-kwish-control="SearchConsole">
               <div id="searchResultsFramelet" data-kwish-control="SearchResultsFramelet" data-maximized="yes">
                  <div id="searchResultsFrameletInner"></div>
               </div>
            </div>
         </div>
      </div>
   </body>
</html>
